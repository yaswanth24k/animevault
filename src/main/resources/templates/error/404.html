<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>404 – Page Not Found – AnimeVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="error-page">
    <div class="error-code">404</div>
    <div class="error-emoji">⛩</div>
    <h1 class="error-title">This Dimension Doesn't Exist</h1>
    <p class="error-desc">The anime or page you're looking for has vanished into the void.</p>
    <div class="error-actions">
        <a href="/" class="btn btn-primary">Go Home</a>
        <a href="/browse" class="btn btn-ghost">Browse Anime</a>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
