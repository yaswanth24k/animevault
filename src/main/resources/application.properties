# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/animevault
spring.datasource.username=postgres
spring.datasource.password=gta vc vv 0928
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File size limits (for future direct upload support)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Logging
logging.level.com.animevault=DEBUG
logging.level.org.springframework.security=INFO

# App custom properties
app.admin.default-username=admin
app.admin.default-password=admin123
