<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Browse – AnimeVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<div class="page-header">
    <h1 class="page-title">Browse Anime</h1>
    <p class="page-subtitle">Discover your next favourite series or movie</p>
</div>

<div class="browse-layout">
    <!-- Filters sidebar -->
    <aside class="filter-sidebar">
        <form th:action="@{/browse}" method="get" id="filterForm" class="filter-form">
            <div class="filter-section">
                <h3 class="filter-title">Type</h3>
                <label class="filter-radio">
                    <input type="radio" name="type" value="" th:checked="${currentType == null or currentType.empty}"/>
                    <span>All</span>
                </label>
                <label class="filter-radio">
                    <input type="radio" name="type" value="SERIES" th:checked="${currentType == 'SERIES'}"/>
                    <span>Series</span>
                </label>
                <label class="filter-radio">
                    <input type="radio" name="type" value="MOVIE" th:checked="${currentType == 'MOVIE'}"/>
                    <span>Movies</span>
                </label>
            </div>

            <div class="filter-section">
                <h3 class="filter-title">Genre</h3>
                <select name="genre" class="filter-select">
                    <option value="">All Genres</option>
                    <option th:each="g : ${genres}"
                            th:value="${g}" th:text="${g}"
                            th:selected="${g == currentGenre}"></option>
                </select>
            </div>

            <div class="filter-section">
                <h3 class="filter-title">Min Rating</h3>
                <select name="minRating" class="filter-select">
                    <option value="">Any</option>
                    <option value="5" th:selected="${currentMinRating == 5}">5+</option>
                    <option value="6" th:selected="${currentMinRating == 6}">6+</option>
                    <option value="7" th:selected="${currentMinRating == 7}">7+</option>
                    <option value="8" th:selected="${currentMinRating == 8}">8+</option>
                    <option value="9" th:selected="${currentMinRating == 9}">9+</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary filter-btn">Apply Filters</button>
            <a th:href="@{/browse}" class="btn btn-ghost filter-btn">Clear</a>
        </form>
    </aside>

    <!-- Results -->
    <main class="browse-results">
        <div class="results-header">
            <span class="results-count"
                  th:text="${videoPage.totalElements + ' result' + (videoPage.totalElements != 1 ? 's' : '')}">
                0 results
            </span>
        </div>

        <div th:if="${videoPage.content.empty}" class="empty-state">
            <div class="empty-icon">🔍</div>
            <h3>No anime found</h3>
            <p>Try adjusting your filters.</p>
            <a th:href="@{/browse}" class="btn btn-primary">Clear Filters</a>
        </div>

        <div th:unless="${videoPage.content.empty}" class="anime-grid browse-grid">
            <div th:each="v : ${videoPage.content}" class="anime-card">
                <a th:href="${v.type.name() == 'MOVIE'} ? @{/watch/movie/{id}(id=${v.id})} : @{/watch/series/{id}(id=${v.id})}"
                   class="card-link">
                    <div class="card-thumb">
                        <img th:if="${v.thumbnailUrl != null and !v.thumbnailUrl.empty}"
                             th:src="${v.thumbnailUrl}" th:alt="${v.title}"
                             onerror="this.src='/images/placeholder.svg'"/>
                        <div th:unless="${v.thumbnailUrl != null and !v.thumbnailUrl.empty}"
                             class="card-thumb-placeholder">
                            <span>⛩</span>
                        </div>
                        <div class="card-overlay"><span class="play-icon">▶</span></div>
                        <div th:class="${'card-type-badge ' + v.type.name().toLowerCase()}"
                             th:text="${v.type.name()}"></div>
                        <div th:if="${v.rating != null}" class="card-rating">
                            ★ <span th:text="${#numbers.formatDecimal(v.rating,1,1)}">8.0</span>
                        </div>
                    </div>
                    <div class="card-info">
                        <h3 class="card-title" th:text="${v.title}">Title</h3>
                        <div class="card-meta">
                            <span th:if="${v.releaseYear}" th:text="${v.releaseYear}"></span>
                            <span th:if="${v.studio}" th:text="${v.studio}"></span>
                        </div>
                        <div class="card-genres" th:if="${v.genres != null and !v.genres.empty}">
                            <span th:each="g, iter : ${v.getGenreArray()}"
                                  th:if="${iter.index < 3}"
                                  th:text="${g.trim()}" class="genre-tag"></span>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <!-- Pagination -->
        <div th:if="${videoPage.totalPages > 1}" class="pagination">
            <a th:if="${videoPage.hasPreviousPage()}"
               th:href="@{/browse(type=${currentType},genre=${currentGenre},minRating=${currentMinRating},page=${currentPage - 1})}"
               class="page-btn">← Prev</a>

            <span th:each="i : ${#numbers.sequence(0, videoPage.totalPages - 1)}">
                <a th:href="@{/browse(type=${currentType},genre=${currentGenre},minRating=${currentMinRating},page=${i})}"
                   th:text="${i + 1}"
                   th:class="${i == currentPage} ? 'page-btn page-active' : 'page-btn'"></a>
            </span>

            <a th:if="${videoPage.hasNextPage()}"
               th:href="@{/browse(type=${currentType},genre=${currentGenre},minRating=${currentMinRating},page=${currentPage + 1})}"
               class="page-btn">Next →</a>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
