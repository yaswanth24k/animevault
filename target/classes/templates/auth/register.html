<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register – AnimeVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="auth-body">

<div class="auth-bg">
    <div class="auth-particles"></div>
</div>

<div class="auth-container">
    <a href="/" class="auth-logo">
        <span class="logo-icon">⛩</span>
        <span class="logo-text">Anime<span class="logo-accent">Vault</span></span>
    </a>
    <h2 class="auth-title">Create Account</h2>
    <p class="auth-subtitle">Join the AnimeVault community</p>

    <div th:if="${errorMessage}" class="flash flash-error">
        <span>✗</span> <span th:text="${errorMessage}"></span>
    </div>

    <form th:action="@{/auth/register}" th:object="${registerForm}" method="post" class="auth-form">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" th:field="*{username}"
                   class="form-input" placeholder="Choose a username"
                   required minlength="3" maxlength="50" autofocus/>
            <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="field-error"></span>
            <small class="form-hint">3–50 characters, letters/numbers/underscores only</small>
        </div>
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="password-wrap">
                <input type="password" id="password" th:field="*{password}"
                       class="form-input" placeholder="At least 6 characters"
                       required minlength="6"/>
                <button type="button" class="toggle-pw" onclick="togglePassword('password')">👁</button>
            </div>
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></span>
        </div>
        <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <div class="password-wrap">
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                       class="form-input" placeholder="Repeat your password" required/>
                <button type="button" class="toggle-pw" onclick="togglePassword('confirmPassword')">👁</button>
            </div>
            <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="field-error"></span>
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Create Account</button>
    </form>

    <div class="auth-footer">
        <p>Already have an account? <a th:href="@{/auth/login}">Sign in</a></p>
        <p><a th:href="@{/}">← Back to Home</a></p>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
