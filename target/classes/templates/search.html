<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${'Search: ' + (query ?: '') + ' – AnimeVault'}">Search – AnimeVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: flash-messages}"></div>

<div class="page-header">
    <h1 class="page-title" th:if="${query != null and !query.empty}">
        Results for "<span th:text="${query}"></span>"
    </h1>
    <h1 class="page-title" th:unless="${query != null and !query.empty}">Search Anime</h1>

    <!-- Search bar -->
    <form th:action="@{/search}" method="get" class="search-page-form">
        <input type="text" name="q" th:value="${query}" placeholder="Search titles, genres…" class="search-page-input"/>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
</div>

<div class="container">
    <div th:if="${results != null and !results.empty}">
        <p class="results-count" th:text="${results.size() + ' result' + (results.size() != 1 ? 's' : '') + ' found'}"></p>
        <div class="anime-grid">
            <div th:each="v : ${results}" class="anime-card">
                <a th:href="${v.type.name() == 'MOVIE'} ? @{/watch/movie/{id}(id=${v.id})} : @{/watch/series/{id}(id=${v.id})}"
                   class="card-link">
                    <div class="card-thumb">
                        <img th:if="${v.thumbnailUrl != null and !v.thumbnailUrl.empty}"
                             th:src="${v.thumbnailUrl}" th:alt="${v.title}"
                             onerror="this.src='/images/placeholder.svg'"/>
                        <div th:unless="${v.thumbnailUrl != null and !v.thumbnailUrl.empty}"
                             class="card-thumb-placeholder"><span>⛩</span></div>
                        <div class="card-overlay"><span class="play-icon">▶</span></div>
                        <div th:class="${'card-type-badge ' + v.type.name().toLowerCase()}"
                             th:text="${v.type.name()}"></div>
                        <div th:if="${v.rating != null}" class="card-rating">
                            ★ <span th:text="${#numbers.formatDecimal(v.rating,1,1)}">8.0</span>
                        </div>
                    </div>
                    <div class="card-info">
                        <h3 class="card-title" th:text="${v.title}">Title</h3>
                        <div class="card-genres" th:if="${v.genres != null and !v.genres.empty}">
                            <span th:each="g, iter : ${v.getGenreArray()}"
                                  th:if="${iter.index < 3}"
                                  th:text="${g.trim()}" class="genre-tag"></span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <div th:if="${results != null and results.empty and query != null and !query.empty}" class="empty-state">
        <div class="empty-icon">🔍</div>
        <h3>No results found for "<span th:text="${query}"></span>"</h3>
        <p>Try different keywords or browse all anime.</p>
        <a th:href="@{/browse}" class="btn btn-primary">Browse All</a>
    </div>

    <div th:if="${query == null or query.empty}" class="empty-state">
        <div class="empty-icon">🔍</div>
        <h3>Search for your favourite anime</h3>
        <p>Enter a title, genre, or description above.</p>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
